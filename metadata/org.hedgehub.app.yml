AutoName: HedgeHub
Summary: Sensibilisation et protection des hérissons
Description: |-
  HedgeHub est une application de sensibilisation et d'information sur le
  hérisson européen, une espèce protégée classée « quasi menacée » par
  l'Union Internationale pour la Conservation de la Nature (UICN).

  L'application propose :
  - reconnaître un hérisson en détresse ;
  - les premiers gestes à adopter ;
  - contacter un centre de soins ;
  - protéger les hérissons dans son jardin ;
  - des informations pour mieux les connaître.

RepoType: git
Repo: https://github.com/sarahgreavey/hedgehub

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm openjdk-17-jdk-headless
    gradle:
      - yes
    prebuild:
      - sed -i 's/versionCode 1/versionCode 1/' app/build.gradle

